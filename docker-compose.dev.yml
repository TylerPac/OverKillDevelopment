services:
  mysql:
    image: mysql:8
    container_name: dev-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: tylerpac_dev
    ports:
      - "3307:3306"
    volumes:
      - mysql_dev_data:/var/lib/mysql

  dayz-mysql:
    image: mysql:8
    container_name: dev-dayz-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: overkill_dayz_dev
    ports:
      - "3308:3306"
    volumes:
      - dayz_mysql_dev_data:/var/lib/mysql

volumes:
  mysql_dev_data:
  dayz_mysql_dev_data:
