# Test profile configuration - uses in-memory H2 database
server.port=8081

# Datasource: use H2 in-memory database for tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Auth settings
app.auth.rate-limit.max-requests-per-minute=120
app.auth.bruteforce.max-failures=10
app.auth.bruteforce.lock-minutes=10
app.login.issuer=http://localhost:8083
app.login.internal-url=http://localhost:8083
app.login.client-secret=test-value
app.auth.github.client-id=test-github-client-id
app.auth.github.client-secret=test-github-value
app.auth.github.redirect-uri=http://localhost:8081/auth/github/callback
app.auth.discord.client-id=test-discord-client-id
app.auth.discord.client-secret=test-discord-client-secret
app.auth.discord.redirect-uri=http://localhost:8081/auth/discord/callback

# Stripe / Shop
app.shop.currency=usd
app.shop.success-url=http://localhost:5173
app.shop.cancel-url=http://localhost:5173
app.shop.reconcile-interval-ms=60000
app.shop.download-root=downloads
app.stripe.secret-key=sk_test_placeholder
app.stripe.webhook-secret=whsec_placeholder
