# Test profile configuration - uses in-memory H2 database
server.port=8081

# JWT Secret for tests
JWT_SECRET=test_jwt_secret_for_testing_purposes_must_be_at_least_32_chars_long

# Datasource: use H2 in-memory database for tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Security - allow weak JWT secret for tests
app.security.allow-weak-jwt-secret=true

# Auth settings
app.auth.access-token-ttl-minutes=15
app.auth.refresh-token-ttl-days=7
app.auth.rate-limit.max-requests-per-minute=120
app.auth.bruteforce.max-failures=10
app.auth.bruteforce.lock-minutes=10
app.auth.steam.realm=http://localhost:8081
app.auth.steam.return-url=http://localhost:8081/auth/steam/callback
app.auth.discord.client-id=test-discord-client-id
app.auth.discord.client-secret=test-discord-client-secret
app.auth.discord.redirect-uri=http://localhost:8081/auth/discord/callback

# Stripe / Shop
app.shop.currency=usd
app.shop.success-url=http://localhost:5173
app.shop.cancel-url=http://localhost:5173
app.shop.reconcile-interval-ms=60000
app.shop.download-root=downloads
app.stripe.secret-key=test_key
app.stripe.webhook-secret=test_secret
