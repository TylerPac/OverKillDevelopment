# Require configuration from environment for safety.
# Set these environment variables in your runtime (see .env template).
server.port=${SERVER_PORT:8080}

# Security
spring.main.allow-bean-definition-overriding=true
app.security.allow-weak-jwt-secret=${APP_SECURITY_ALLOW_WEAK_JWT_SECRET:false}
app.admin.steam64-ids=${APP_ADMIN_STEAM64_IDS:76561199155324762}

# Flyway disabled by default; enable if you add migrations
spring.flyway.enabled=false

# Disable open-in-view (avoids startup warning; sessions are managed manually)
spring.jpa.open-in-view=false

# DayZ server API (separate MySQL, plain JDBC; disabled unless DAYZ_ENABLED=true)
app.dayz.enabled=${DAYZ_ENABLED:false}
app.dayz.max-data-bytes=${DAYZ_MAX_DATA_BYTES:262144}
app.dayz.datasource.url=${DAYZ_DB_URL:}
app.dayz.datasource.username=${DAYZ_DB_USERNAME:}
app.dayz.datasource.password=${DAYZ_DB_PASSWORD:}
app.dayz.datasource.max-pool-size=${DAYZ_DB_MAX_POOL_SIZE:10}
app.dayz.bootstrap.server-id=${DAYZ_BOOTSTRAP_SERVER_ID:}
app.dayz.bootstrap.api-key=${DAYZ_BOOTSTRAP_API_KEY:}

# Auth token settings
app.auth.frontend-base-url=${APP_AUTH_FRONTEND_BASE_URL:http://localhost:5173}
app.auth.access-token-ttl-minutes=${APP_AUTH_ACCESS_TOKEN_TTL_MINUTES:15}
app.auth.refresh-token-ttl-days=${APP_AUTH_REFRESH_TOKEN_TTL_DAYS:7}
app.auth.rate-limit.max-requests-per-minute=${APP_AUTH_RATE_LIMIT_MAX_REQUESTS_PER_MINUTE:60}
app.auth.bruteforce.max-failures=${APP_AUTH_BRUTEFORCE_MAX_FAILURES:5}
app.auth.bruteforce.lock-minutes=${APP_AUTH_BRUTEFORCE_LOCK_MINUTES:15}

# Steam OpenID
app.auth.steam.realm=${APP_AUTH_STEAM_REALM:http://localhost:8081}
app.auth.steam.return-url=${APP_AUTH_STEAM_RETURN_URL:http://localhost:8081/auth/steam/callback}

# Discord OAuth
app.auth.discord.client-id=${APP_AUTH_DISCORD_CLIENT_ID:}
app.auth.discord.client-secret=${APP_AUTH_DISCORD_CLIENT_SECRET:}
app.auth.discord.redirect-uri=${APP_AUTH_DISCORD_REDIRECT_URI:http://localhost:8081/auth/discord/callback}

# GitHub OAuth (for account linking)
app.auth.github.client-id=${APP_AUTH_GITHUB_CLIENT_ID:}
app.auth.github.client-secret=${APP_AUTH_GITHUB_CLIENT_SECRET:}
app.auth.github.redirect-uri=${APP_AUTH_GITHUB_REDIRECT_URI:http://localhost:8081/auth/github/callback}

# GitHub bot token (PAT with repo admin access, used to grant collaborator access on purchase)
app.github.bot-token=${APP_GITHUB_BOT_TOKEN:}

# Per-product GitHub repo mappings (format: owner/repo). When set, purchasing the product grants read access to the repo.
# app.shop.github-repo.keycard-crates=${APP_SHOP_GITHUB_REPO_KEYCARD_CRATES:}

# Stripe / Shop
app.shop.currency=${APP_SHOP_CURRENCY:usd}
app.shop.success-url=${APP_SHOP_SUCCESS_URL:http://localhost:5173}
app.shop.cancel-url=${APP_SHOP_CANCEL_URL:http://localhost:5173}
app.shop.reconcile-interval-ms=${APP_SHOP_RECONCILE_INTERVAL_MS:300000}
app.shop.download-root=${APP_SHOP_DOWNLOAD_ROOT:downloads}
# Per-product download links (optional). When set, the download button opens the URL instead of serving a zip.
# app.shop.download-link.keycard-crates=${APP_SHOP_DOWNLOAD_LINK_KEYCARD_CRATES:}
app.stripe.secret-key=${STRIPE_SECRET_KEY:}
app.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
app.stripe.premium-price-id=${STRIPE_PREMIUM_PRICE_ID:}