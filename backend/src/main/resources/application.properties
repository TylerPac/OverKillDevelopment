# Require configuration from environment for safety.
# Set these environment variables in your runtime (see .env template).
server.port=${SERVER_PORT:8080}

# Security
spring.main.allow-bean-definition-overriding=true
app.security.allow-weak-jwt-secret=${APP_SECURITY_ALLOW_WEAK_JWT_SECRET:false}

# Flyway disabled by default; enable if you add migrations
spring.flyway.enabled=false

# Auth token settings
app.auth.frontend-base-url=${APP_AUTH_FRONTEND_BASE_URL:http://localhost:5173}
app.auth.access-token-ttl-minutes=${APP_AUTH_ACCESS_TOKEN_TTL_MINUTES:15}
app.auth.refresh-token-ttl-days=${APP_AUTH_REFRESH_TOKEN_TTL_DAYS:7}
app.auth.rate-limit.max-requests-per-minute=${APP_AUTH_RATE_LIMIT_MAX_REQUESTS_PER_MINUTE:60}
app.auth.bruteforce.max-failures=${APP_AUTH_BRUTEFORCE_MAX_FAILURES:5}
app.auth.bruteforce.lock-minutes=${APP_AUTH_BRUTEFORCE_LOCK_MINUTES:15}

# Steam OpenID
app.auth.steam.realm=${APP_AUTH_STEAM_REALM:http://localhost:8081}
app.auth.steam.return-url=${APP_AUTH_STEAM_RETURN_URL:http://localhost:8081/auth/steam/callback}

# Discord OAuth
app.auth.discord.client-id=${APP_AUTH_DISCORD_CLIENT_ID:}
app.auth.discord.client-secret=${APP_AUTH_DISCORD_CLIENT_SECRET:}
app.auth.discord.redirect-uri=${APP_AUTH_DISCORD_REDIRECT_URI:http://localhost:8081/auth/discord/callback}

# Stripe / Shop
app.shop.currency=${APP_SHOP_CURRENCY:usd}
app.shop.success-url=${APP_SHOP_SUCCESS_URL:http://localhost:5173}
app.shop.cancel-url=${APP_SHOP_CANCEL_URL:http://localhost:5173}
app.shop.reconcile-interval-ms=${APP_SHOP_RECONCILE_INTERVAL_MS:300000}
app.shop.download-root=${APP_SHOP_DOWNLOAD_ROOT:downloads}
app.stripe.secret-key=${STRIPE_SECRET_KEY:}
app.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
app.stripe.premium-price-id=${STRIPE_PREMIUM_PRICE_ID:}